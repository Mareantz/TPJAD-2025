spring.application.name=sales-api

# --- MS SQL Server Sales Database ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=sales_db;trustServerCertificate=true;
spring.datasource.username=sales_admin
spring.datasource.password=password

# --- JPA Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# --- Server Port ---
# Run this service on port 8083
server.port=8083