<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Order</title>
    <link rel="stylesheet" th:href="@{/css/edit-style.css}" />
</head>
<body>

<h1>Edit Order</h1>
<hr>

<form method="post" th:action="@{/update-order}" th:object="${order}">

    <input type="hidden" th:field="*{id}" />

    <div>
        <label for="customerIdLink">Customer ID:</label>
        <input type="number" id="customerIdLink" th:field="*{customerIdLink}" />
    </div>
    <div>
        <label for="productIdLink">Product ID:</label>
        <input type="number" id="productIdLink" th:field="*{productIdLink}" />
    </div>

    <button type="submit">Update</button>
    <a href="/">Cancel</a>
</form>

</body>
</html>
