<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" th:href="@{/css/edit-style.css}" />
</head>
<body>

<h1>Edit Product</h1>
<hr>

<form method="post" th:action="@{/update-product}" th:object="${product}">

    <input type="hidden" th:field="*{id}" />

    <div>
        <label for="productName">Product Name:</label>
        <input type="text" id="productName" th:field="*{productName}" />
    </div>
    <div>
        <label for="price">Price:</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" />
    </div>

    <button type="submit">Update</button>
    <a href="/">Cancel</a>
</form>

</body>
</html>
